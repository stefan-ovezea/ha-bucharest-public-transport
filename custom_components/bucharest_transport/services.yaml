get_arrivals:
  fields:
    stop_id:
      required: true
      example: "15100"
      selector:
        text:
    route_ids:
      example: ["999"]
      selector:
        text:
          multiple: true
    direction_id:
      selector:
        select:
          options: ["0", "1"]
    limit:
      default: 10
      selector:
        number:
          min: 1
          max: 50
          mode: box
    horizon_minutes:
      default: 60
      selector:
        number:
          min: 1
          max: 1440
          mode: box
